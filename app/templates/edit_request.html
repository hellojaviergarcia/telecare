{% extends "base.html" %}
{% block content %}
<div class="auth-shell">
  <div class="auth-card">
    <h2>Edit Assistance #{{ target.id }}</h2>
    {% if error %}<div class="alert">{{ error }}</div>{% endif %}
    <form method="post" action="/technician/edit_request/{{ target.id }}" class="form-stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label>Status
        <select name="status" required>
          <option value="requested" {% if target.status == 'requested' %}selected{% endif %}>Requested</option>
          <option value="acknowledged" {% if target.status == 'acknowledged' %}selected{% endif %}>Acknowledged</option>
          <option value="resolved" {% if target.status == 'resolved' %}selected{% endif %}>Resolved</option>
        </select>
      </label>
      
      <label>Observations
        <textarea name="message" rows="5" style="width: 100%; padding: 0.75rem; font-family: inherit; border: 1px solid #d1d5db; border-radius: 6px; resize: vertical; box-sizing: border-box;">{{ target.message or '' }}</textarea>
      </label>
      
      <div style="display:flex;gap:12px;margin-top:12px">
        <button class="btn btn-primary" type="submit" style="flex:1">Save Changes</button>
        <a href="/technician/dashboard" class="btn btn-secondary" style="text-align:center; padding-top: 10px; flex:1">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
