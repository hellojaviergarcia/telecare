{% extends "base.html" %}
{% block content_wrapper %}
<main style="width: 100%; overflow-x: hidden;">
<section class="auth-shell">
  <div class="auth-card">
    <div class="auth-icon">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" /></svg>
    </div>
    <h1>Operator Login</h1>
    {% if error %}<div class="alert">{{ error }}</div>{% endif %}
    <form method="post" class="form-stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label>Email<input type="email" name="email" required></label>
      <label>Password<input type="password" name="password" required></label>
      <button class="btn btn-primary" type="submit">Login</button>
    </form>
  </div>
</section>
</main>
{% endblock %}
